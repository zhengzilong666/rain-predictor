<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>降雨预测系统</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 350px; }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #666; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        button { width: 100%; padding: 10px; background-color: #007BFF; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #0056b3; }
        #result { margin-top: 20px; padding: 15px; text-align: center; border-radius: 5px; font-weight: bold; display: none; }
        .rain { background-color: #d1ecf1; color: #0c5460; }
        .no-rain { background-color: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🌦️ 明日降雨预测</h2>
        <div class="form-group">
            <label>最低气温 (MinTemp):</label>
            <input type="number" step="0.1" id="MinTemp" value="15.0">
        </div>
        <div class="form-group">
            <label>最高气温 (MaxTemp):</label>
            <input type="number" step="0.1" id="MaxTemp" value="25.0">
        </div>
        <div class="form-group">
            <label>降雨量 (Rainfall):</label>
            <input type="number" step="0.1" id="Rainfall" value="0.0">
        </div>
        <div class="form-group">
            <label>早9点湿度 (Humidity9am):</label>
            <input type="number" step="0.1" id="Humidity9am" value="60.0">
        </div>
        <div class="form-group">
            <label>风向 (WindGustDir):</label>
            <select id="WindGustDir">
                <option value="0">N (北)</option>
                <option value="1">S (南)</option>
                <option value="2">E (东)</option>
                <option value="3">W (西)</option>
                <option value="4">NE (东北)</option>
                <option value="5">SW (西南)</option>
            </select>
        </div>
        <button onclick="predict()">开始预测</button>
        <div id="result"></div>
    </div>

    <script>
        async function predict() {
            const data = {
                MinTemp: parseFloat(document.getElementById('MinTemp').value),
                MaxTemp: parseFloat(document.getElementById('MaxTemp').value),
                Rainfall: parseFloat(document.getElementById('Rainfall').value),
                Humidity9am: parseFloat(document.getElementById('Humidity9am').value),
                WindGustDir: parseInt(document.getElementById('WindGustDir').value)
            };

            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';
            resultDiv.className = '';
            resultDiv.innerHTML = '预测中...';

            try {
                // 调用我们后端的 /predict 接口
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                if (response.ok) {
                    resultDiv.innerText = result.description;
                    // 根据结果添加不同的颜色样式
                    resultDiv.className = result.prediction === 1 ? 'rain' : 'no-rain';
                } else {
                    resultDiv.innerText = '预测失败：参数格式错误';
                    resultDiv.className = 'rain';
                }
            } catch (error) {
                resultDiv.innerText = '网络连接失败';
                resultDiv.className = 'rain';
            }
        }
    </script>
</body>
</html>
